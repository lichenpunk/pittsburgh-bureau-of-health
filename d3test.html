<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pittsburgh Bureau of Health, 1892-1897</title>
    <style>
        body {
            background-color: #595959; 
        }
		.tick {
			color:#ffffff;
		}
		.domain {
			stroke:#ffffff;
		}
		.news {
			background-color: #e2f0c5;
			background-image: url("clean-gray-paper1.png");
			}
}	
    </style>
</head>

<div id="container"></div>
<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Declare the chart dimensions and margins.
const width = 640;
const height = 400;
const marginTop = 300;
const marginRight = 20;
const marginBottom = -300;
const marginLeft = 40;
const totalHeight = 1000;
const totalWidth = 1400;

const HEADERS = ['Alleys Filthy', 'Defective Drainage'];
const bolded = [2, 0]
const COLORS = ["#00a1ab", "#7fd1ae"];

	
const parseD = (value, header) => {
	return {date: d3.timeParse("%m/%Y")(value["Month/Year"]), value: value[header], title: header};
}
// const data = await d3.csv("testdata.csv", parseD);

const data = await d3.csv("testdata.csv", 
	d => {
		const valueObject = {};
		HEADERS.forEach(header => {
			valueObject[header] = d[header]
		});
		return {
			date: d3.timeParse("%m/%Y")(d["Month/Year"]),
			values: valueObject
		}
	}
	
);

// Declare the x (horizontal position) scale.
const x = d3.scaleTime()
    .domain(d3.extent(data, function(d) { return d.date; }))
    .range([marginLeft, width - marginRight]);

// Declare the y (vertical position) scale.
const y = d3.scaleLinear()
    .domain([0, 300])
    .range([height - marginBottom, marginTop]);

// Create the SVG container.
const svg = d3.create("svg")
    .attr("width", totalWidth)
    .attr("height", totalHeight)
//Create title
svg.append("text")
	.text("Report of Chief  Sanitary Inspector, 1892")
	.attr("x", 360)
	.attr("y", 60)
	.attr("fill", "#F0E1B2")
	.style("font-size", "40px")
	.style("font-family", "serif")

svg.append("foreignObject")
  .attr("x", 290)
  .attr("y", 90)
  .attr("width", 860)   // Strict width limits forcing text to wrap
  .attr("height", 200)
  .append("xhtml:div")  
  .style("font", "14px 'Helvetica Neue'")
  .style("padding", "8px")
  .style("background", "white")
  .style("border", "1px solid black")
  .style("border-radius", "8px") 
  .html(`Sometimes, when historical data is visualized using modern digital technologies, it can appear stripped of context, lacking
  connection to any of the original meanings that existed around the records behind the data. This is a small experiment, inspired by the <a
  href="https://civic-switchboard.github.io/">Civic Switchboard Project</a>, to situate some historical data, albeit in a 
  fairly disjointed fashion. The data comes from <a href="https://historicpittsburgh.org/collection/department-public-health">scanned annual reports</a> of the Pittsburgh Bureau of Health (later Department of Public Health)
  made available by <a href="https://historicpittsburgh.org">Historic Pittsburgh</a> through the University of Pittsburgh Library System. 
  <br><br>
  I was struck by some of the words in the column titles, which seemed, to my eyes, different from the language you might find in a (21st century) public health report. 
  Bolded words can be clicked on, will bring up several quotes from newspapers within a two year span of the year of the record. The newspaper snippets, containing the 
  clicked on word, were gathered using the Library of Congress's API to search the Chroncling America program, cataloguing newspapers
  produced through the National Digital Newspaper Program, a partnership between the National Endowment for the Humanities and the Library of Congress.
  `)
  
// Add the x-axis.
svg.append("g")
    .attr("transform", `translate(0,${height - marginBottom})`)
    .call(d3.axisBottom(x));

// Add the y-axis.
svg.append("g")
    .attr("transform", `translate(${marginLeft},0)`)
    .call(d3.axisLeft(y));
	
HEADERS.forEach((header, i) => {
	svg.append("path")
		.datum(data)
		.attr("fill", "none")
		.attr("stroke", COLORS[i])
		.attr("stroke-width", 1.5)
		.attr("d", d3.area()
		  .x(function(d) { return x(d.date) })
		  .y0(y(0))
		  .y1(function(d) { return y(d.values[header]) })
		  )
})
//first legend item
	svg.append("circle")
		.attr("cx", 480)
		.attr("cy", 295) 
		.attr("r", 7)
		.style("fill", COLORS[0])
	
	const legendtext = svg.append("text")
		.attr("x", 500)
		.attr("y", 300) 
		.style("fill", COLORS[1])
		.text("Alleys ")
		.attr("text-anchor", "left")
		.style("alignment-baseline", "middle")
		
	legendtext.append("tspan")
		.text("Filthy")
		.attr("class", "filthy")
		.style("font-weight", "bold")
		
//second legend item
		svg.append("circle")
		.attr("cx", 480)
		.attr("cy", 315) 
		.attr("r", 7)
		.style("fill", COLORS[1])
	
	const legendtext1 = svg.append("text")
		.attr("x", 500)
		.attr("y", 320) 
		.style("fill", COLORS[1])
		.text("Defective ")
		.attr("text-anchor", "left")
		.style("alignment-baseline", "middle")
		
	legendtext1.append("tspan")
		.text("Drainage")

		


//loop over elements of filthy class and add event listener.
const newsdata = await d3.text("filthydata1.txt ");
const datalines = newsdata.split(/\r?\n/);
const datalines1 = datalines.filter(str => str.length > 1);

const scrambleddata = datalines1.sort(() => Math.random() - 0.5);
console.log(scrambleddata);
//Create empty boxes for news snippets
for (let i = 0; i < 3; i++) {
	svg.append("foreignObject")
	  .attr("x", 820)
	  .attr("y", 350 + (i*140))
	  .attr("width", 400)   
	  .attr("height",200)
	  .append("xhtml:div")  
	  .attr("class", "news")
	  .style("font", "13px 'Helvetica Neue'")
	  .style("padding", "20px")
	  //.style("background", "white")
	  .style("border", "1px solid black")
	  .style("border-radius", "8px")
	  .html(scrambleddata[i])
} 
container.append(svg.node());
</script>
